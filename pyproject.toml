[project]
name = "bwsort"
version = "0.1.0"
description = "Sort Bitwarden vault items into folders using a local Ollama model. Secrets never leave bw <-> this process."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tldextract>=5.1",
    "typer>=0.12",
]

[project.scripts]
bwsort = "bwsort.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bwsort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
